<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | Wawatootoo art studio</title>
<meta name="description" content="東京・亀戸の絵画教室 Wawatootoo art studio へのお問い合わせ・体験レッスンのお申し込み。亀戸6-57-7、こども美術とデッサンの教室です。">
<link rel="canonical" href="https://wawatootoo.com/contact.html">
<meta name="theme-color" content="#F5F4FA">
<meta property="og:site_name" content="Wawatootoo art studio">
<meta property="og:title" content="お問い合わせ | Wawatootoo art studio">
<meta property="og:description" content="体験レッスンのお申し込み・お問い合わせはこちらから。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wawatootoo.com/contact.html">
<meta property="og:image" content="https://wawatootoo.com/assets/works/01.jpg">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">

<div id="progressBar"></div>
<div id="site-header"></div>

<main>
  <div class="page-head" data-ghost="06">
    <p class="sec-num">06 — Contact</p>
    <h1 class="i18n-fade" data-i18n="contact_title">まずは、体験から。</h1>
    <p class="sec-desc i18n-fade" data-i18n="contact_desc">見学・体験レッスンはいつでも歓迎です。お気軽にお問い合わせください。</p>
  </div>

  <section class="block">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info reveal">
          <dl>
            <dt>Address</dt>
            <dd class="i18n-fade" data-i18n="addr">〒136-0071 東京都江東区亀戸6-57-7<br>北斗スターマンション亀戸 804号</dd>
            <dt>Open</dt>
            <dd class="i18n-fade" data-i18n="open">火・水 16:50〜21:00｜土 10:00〜18:10｜日 19:00〜21:00</dd>
          </dl>
        </div>
        <form class="contact-form reveal" id="contactForm">
          <input type="text" id="f-honey" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0" aria-hidden="true">
          <div class="form-row">
            <label for="f-name" class="i18n-fade" data-i18n="f_name">お名前</label>
            <input id="f-name" type="text" required>
          </div>
          <div class="form-row">
            <label for="f-email" class="i18n-fade" data-i18n="f_email">メールアドレス</label>
            <input id="f-email" type="email" required>
          </div>
          <div class="form-row">
            <label for="f-course" class="i18n-fade" data-i18n="f_course">ご希望のコース</label>
            <select id="f-course">
              <option class="i18n-fade" data-i18n="f_c1">こども美術コース（3歳〜就学前）</option>
              <option class="i18n-fade" data-i18n="f_c2">こども美術コース（小学生）</option>
              <option class="i18n-fade" data-i18n="f_c3">デッサンコース</option>
              <option class="i18n-fade" data-i18n="f_c4">未定・相談したい</option>
            </select>
          </div>
          <div class="form-row">
            <label for="f-msg" class="i18n-fade" data-i18n="f_msg">メッセージ</label>
            <textarea id="f-msg"></textarea>
          </div>
          <button type="submit" class="btn btn-solid"><span class="i18n-fade" data-i18n="f_send">送信する</span><span class="arrow">→</span></button>
          <p class="form-sent" id="formSent" data-i18n="f_sent">送信しました。2営業日以内にご返信いたします。（デモ表示です）</p>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
